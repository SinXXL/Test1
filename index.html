<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космическая Одиссея 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }

        /* Стили для левой панели (документа) */
        #info-panel {
            position: absolute;
            top: 0;
            left: -400px; 
            width: 350px;
            height: 100vh;
            background: rgba(5, 10, 20, 0.9);
            backdrop-filter: blur(10px);
            border-right: 2px solid #4a90e2;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            overflow-y: auto;
            box-shadow: 5px 0 20px rgba(74, 144, 226, 0.3);
        }

        #info-panel.open { left: 0; }

        #info-panel h2 {
            color: #4a90e2;
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        #info-panel p { line-height: 1.6; font-size: 15px; color: #ccc; }

        #close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #ff4a4a;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        
        #close-btn:hover { color: #fff; transform: scale(1.1); }

        #hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.4);
            pointer-events: none;
            font-size: 14px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="info-panel">
        <button id="close-btn">✖</button>
        <h2 id="star-title">Название объекта</h2>
        <p id="star-desc">Информация...</p>
    </div>

    <div id="hint">Вращай мышкой. Нажми на светящуюся точку (звезду или планету)</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        // Чистый черный фон
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.01); // Легкий туман для глубины

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.2; // Очень медленное вращение всей сцены
        controls.maxDistance = 40;
        controls.minDistance = 3;

        // ==========================================
        // 1. ФОН: КОСМИЧЕСКАЯ ПЫЛЬ И ЗВЕЗДЫ
        // ==========================================
        const bgStarsGeo = new THREE.BufferGeometry();
        const bgStarsCount = 3000;
        const bgPositions = new Float32Array(bgStarsCount * 3);
        for(let i=0; i<bgStarsCount * 3; i++) {
            bgPositions[i] = (Math.random() - 0.5) * 100; // Разбрасываем на 100 единиц
        }
        bgStarsGeo.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
        const bgStarsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, sizeAttenuation: true });
        const bgStars = new THREE.Points(bgStarsGeo, bgStarsMat);
        scene.add(bgStars);

        // Текстура для круглых точек
        function getStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }
        const pointTexture = getStarTexture();

        // ==========================================
        // 2. ЧЕРНАЯ ДЫРА НА ФОНЕ
        // ==========================================
        const blackHoleGroup = new THREE.Group();
        blackHoleGroup.position.set(-15, 8, -25); // Вдалеке слева сверху
        
        // Сфера (горизонт событий)
        const bhSphere = new THREE.Mesh(
            new THREE.SphereGeometry(2, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0x000000 })
        );
        blackHoleGroup.add(bhSphere);

        // Аккреционный диск (светящееся кольцо)
        const diskGeo = new THREE.RingGeometry(2.5, 4.5, 64);
        const diskMat = new THREE.MeshBasicMaterial({ 
            color: 0x4a90e2, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const disk = new THREE.Mesh(diskGeo, diskMat);
        disk.rotation.x = Math.PI / 2.5; // Наклоняем диск
        blackHoleGroup.add(disk);
        
        scene.add(blackHoleGroup);

        // ==========================================
        // 3. ЯРКАЯ СПИРАЛЬНАЯ ГАЛАКТИКА (В ЦЕНТРЕ)
        // ==========================================
        const galaxyGroup = new THREE.Group();
        const particlesCount = 30000;
        const positions = new Float32Array(particlesCount * 3);
        const colors = new Float32Array(particlesCount * 3);

        const colorInside = new THREE.Color('#ffffff');
        const colorOutside1 = new THREE.Color('#00e5ff'); // Яркий циан
        const colorOutside2 = new THREE.Color('#ff00ea'); // Яркий пурпур

        for (let i = 0; i < particlesCount; i++) {
            const i3 = i * 3;
            const r = Math.random() * 6; 
            const branchAngle = (i % 4) / 4 * Math.PI * 2;
            const spinAngle = r * 1.8;
            
            const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3 * r;
            const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3;
            const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3 * r;

            positions[i3] = Math.cos(branchAngle + spinAngle) * r + randomX;
            positions[i3 + 1] = randomY;
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

            const mixedColor = colorInside.clone();
            if (r < 3) mixedColor.lerp(colorOutside1, r / 3);
            else mixedColor.lerp(colorOutside2, (r - 3) / 3);

            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        const galaxyGeometry = new THREE.BufferGeometry();
        galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const galaxyMaterial = new THREE.PointsMaterial({
            size: 0.06,
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true,
            map: pointTexture,
            transparent: true
        });

        const galaxyParticles = new THREE.Points(galaxyGeometry, galaxyMaterial);
        galaxyGroup.add(galaxyParticles);
        galaxyGroup.rotation.x = 0.4;
        scene.add(galaxyGroup);

        // ==========================================
        // 4. ПЛАНЕТЫ РАЗНЫХ ЦВЕТОВ (КЛИКАБЕЛЬНЫЕ)
        // ==========================================
        const clickableObjects = [];
        
        const objectData = [
            { title: "Имя", desc: "Липучка" },
            { title: "Раса", desc: "Восьмая планета от Солнца. Имеет ярко-синий цвет из-за присутствия метана в атмосфере. Дуют самые сильные ветры в Солнечной системе." },
            { title: "Внешнее описание", desc: "Экзопланета, вращающаяся вокруг красного карлика. Находится в зоне обитаемости, теоретически там может быть вода." },
            { title: "Сатурн (Властелин колец)", desc: "Газовый гигант, знаменитый своей системой колец, состоящих из миллиардов частиц льда и камня." },
            { title: "Альфа Сириус", desc: "Ярчайшая звезда ночного неба. На самом деле это двойная звездная система." }
        ];

        const planetColors = [0xff4a4a, 0x4a90e2, 0x2ecc71, 0xf39c12, 0x9b59b6];

        // Создаем планеты
        for (let i = 0; i < planetColors.length; i++) {
            const isRinged = i === 3; // У 4-й планеты будут кольца
            
            const geometry = new THREE.SphereGeometry(0.4, 32, 32);
            const material = new THREE.MeshStandardMaterial({ 
                color: planetColors[i],
                roughness: 0.4,
                metalness: 0.1,
                emissive: planetColors[i], // Легкое свечение
                emissiveIntensity: 0.2
            });
            const planet = new THREE.Mesh(geometry, material);

            // Расставляем планеты вокруг центра
            const angle = (i / planetColors.length) * Math.PI * 2;
            const distance = 8 + Math.random() * 4;
            planet.position.x = Math.cos(angle) * distance;
            planet.position.z = Math.sin(angle) * distance;
            planet.position.y = (Math.random() - 0.5) * 4;

            // Если это Сатурн, добавляем кольца
            if (isRinged) {
                const ringGeo = new THREE.RingGeometry(0.6, 1.0, 32);
                const ringMat = new THREE.MeshStandardMaterial({ 
                    color: 0xffffff, 
                    side: THREE.DoubleSide, 
                    transparent: true, 
                    opacity: 0.5 
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.5;
                planet.add(ring);
            }

            // Добавляем ореол свечения, чтобы на них можно было кликать
            const glowMaterial = new THREE.SpriteMaterial({ 
                map: pointTexture, 
                color: planetColors[i], 
                transparent: true, 
                blending: THREE.AdditiveBlending 
            });
            const glow = new THREE.Sprite(glowMaterial);
            glow.scale.set(2.5, 2.5, 1);
            planet.add(glow);

            planet.userData = objectData[i];
            scene.add(planet);
            clickableObjects.push(planet);
        }

        // Добавляем несколько кликабельных звезд
        for (let i = 0; i < 5; i++) {
            const starGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const star = new THREE.Mesh(starGeo, starMat);
            
            star.position.x = (Math.random() - 0.5) * 15;
            star.position.y = (Math.random() - 0.5) * 8;
            star.position.z = (Math.random() - 0.5) * 15;

            const glowMaterial = new THREE.SpriteMaterial({ 
                map: pointTexture, color: 0x4a90e2, transparent: true, blending: THREE.AdditiveBlending 
            });
            const glow = new THREE.Sprite(glowMaterial);
            glow.scale.set(1, 1, 1);
            star.add(glow);

            star.userData = objectData[(i + 2) % objectData.length];
            scene.add(star);
            clickableObjects.push(star);
        }

        // Освещение
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 3, 100);
        pointLight.position.set(0, 0, 0); // Свет из центра галактики
        scene.add(pointLight);

        // ==========================================
        // 5. ЛОГИКА КЛИКА И UI
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const panel = document.getElementById('info-panel');
        const panelTitle = document.getElementById('star-title');
        const panelDesc = document.getElementById('star-desc');
        const closeBtn = document.getElementById('close-btn');

        closeBtn.addEventListener('click', () => panel.classList.remove('open'));

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                // Находим корневой объект (планету или звезду), чтобы взять из него данные
                let clickedObj = intersects[0].object;
                while (clickedObj.parent && !clickedObj.userData.title) {
                    clickedObj = clickedObj.parent;
                }

                if (clickedObj.userData.title) {
                    panelTitle.textContent = clickedObj.userData.title;
                    panelDesc.textContent = clickedObj.userData.desc;
                    panel.classList.add('open');
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 6. АНИМАЦИЯ
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Вращение галактики
            galaxyGroup.rotation.y = elapsedTime * 0.05;
            
            // Вращение фоновых звезд (эффект параллакса)
            bgStars.rotation.y = elapsedTime * 0.01;

            // Вращение аккреционного диска черной дыры
            disk.rotation.z = elapsedTime * 0.5;

            // Пульсация и вращение планет
            clickableObjects.forEach((obj, index) => {
                // Планеты вращаются вокруг своей оси
                obj.rotation.y += 0.01;
                
                // Легкая пульсация ореола (если он есть)
                const glow = obj.children.find(child => child.isSprite);
                if (glow) {
                    const scale = 2.5 + Math.sin(elapsedTime * 2 + index) * 0.2;
                    glow.scale.set(scale, scale, 1);
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
